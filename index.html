:root{--ink:#131A33;--blue:#2340C8;--blue-d:#182C94;--tint:#E9EEFF;--paper:#F3F5FB;--card:#fff;--line:#E0E5F2;--mute:#5A6380;--gold:#FFB703;--red:#D92D20;--green:#0E7A56;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 "Bricolage",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;font-variant-numeric:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:6px;padding:10px 12px 8px 18px;padding-top:calc(10px + env(safe-area-inset-top))}
header.sub{padding-left:8px}
header h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
header.sub h1{font-size:19px;letter-spacing:-.2px}
header h1 span{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-weight:400;font-size:17px;color:var(--blue);margin-left:10px;letter-spacing:0}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:var(--line)} .ib svg{width:22px;height:22px}
main{max-width:640px;margin:0 auto;padding:6px 14px 120px}
.rs{font-size:.55em;font-weight:600;opacity:.75;margin-right:5px;letter-spacing:0}

/* balance card: a slice of ruled ledger paper in cobalt */
.hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:22px 22px 20px 34px;margin-bottom:18px;
  background:repeating-linear-gradient(#0000 0 29px,#ffffff17 29px 30px),linear-gradient(160deg,var(--blue),var(--blue-d))}
.hero::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--gold)}
.hero .lbl{font-size:14px;font-weight:500;opacity:.85}
.hero .amt{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.15;margin-top:2px;word-break:break-word}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .meta span{background:#ffffff1f;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}

h2.sec{font-size:15px;font-weight:700;margin:0 4px 8px;color:var(--mute)}
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-bottom:16px}
.list>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;border-top:1px solid var(--line)}
.list>button:first-child{border-top:0}
.list>button:active{background:var(--paper)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;color:#fff}
.av.c0{background:var(--blue)}.av.c1{background:var(--gold);color:var(--ink)}.av.c2{background:var(--green)}.av.c3{background:#B4236F}
.pn{flex:1;min-width:0}.pn b{display:block;font-weight:700;font-size:16px;line-height:1.25}
.pn small,.side{font-size:13px;color:var(--mute);font-weight:500}
.pb{text-align:right;flex:none}.pb b{display:block;font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.CR{color:var(--red)}.DR{color:var(--green)}.NIL{color:var(--mute)}
.pb .rs{font-size:.72em}
.pb .side.CR,.pb .side.DR{font-weight:700}
.hint{font-size:13px;color:var(--mute);margin:0 6px;line-height:1.5}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.tile small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.tile b{font-size:18px;font-weight:700;letter-spacing:-.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:16px;align-items:end}
.filter label{margin:0 0 3px 4px}
.filter input{padding:9px 10px;font-size:14px;background:var(--card)}
.chip{height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}

/* ledger rows */
.list>button.en{align-items:flex-start;gap:14px;padding:14px 16px 12px 12px}
.dt{width:44px;flex:none;text-align:center;border-radius:12px;background:var(--paper);padding:6px 0 5px;line-height:1.1}
.dt b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}.dt small{font-size:11.5px;color:var(--mute);font-weight:600}
.eb{flex:1;min-width:0}
.ln{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ln+.ln{margin-top:5px}
.ln .t{font-weight:600;min-width:0}.ln .t small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.ln .a{font-weight:700;white-space:nowrap;letter-spacing:-.2px}
.veh{display:inline-block;font-size:12px;font-weight:700;background:var(--tint);color:var(--blue-d);border-radius:7px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.note{font-size:13px;color:var(--mute);margin-top:4px}
.run{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--mute);font-weight:500}
.run b{font-weight:700}
.empty{text-align:center;color:var(--mute);padding:34px 20px;background:var(--card);border:1px dashed #c5cde3;border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(#f3f5fb00,var(--paper) 30%);padding:18px 14px calc(14px + env(safe-area-inset-bottom))}
.bar>div{display:flex;gap:10px;max-width:612px;margin:0 auto}
.btn{flex:1;min-height:56px;border-radius:18px;font-weight:700;font-size:16.5px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 16px #ffb70355}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 16px #2340c844}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.del{background:#fff;color:var(--red);border:1.5px solid #f3c2bd;min-height:50px}
.btn svg{width:18px;height:18px}

label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px 4px}
input{width:100%;font:inherit;font-size:17px;font-weight:500;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px #2340c81f}
input::placeholder{color:#9aa3bd}
.sheet{position:fixed;inset:0;z-index:20;background:#131a3388;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet>div{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet>div::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet>div{animation:none}.btn{transition:none}}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:800;letter-spacing:-.4px}
.seg{display:flex;background:var(--paper);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:46px;border-radius:12px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.total{background:var(--tint);border-radius:16px;padding:14px 16px;margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total span:first-child{font-size:14px;font-weight:600;color:var(--blue-d)}
.total span:last-child{font-size:24px;font-weight:800;color:var(--blue-d);letter-spacing:-.6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;margin-top:18px}
.menu{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:15px 16px;border-top:1px solid var(--line);font-size:16px;font-weight:600}
.menu button:first-child{border-top:0}.menu button:active{background:var(--paper)}
.menu small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.menu svg{width:18px;height:18px;color:#9aa3bd;flex:none}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lock{position:fixed;inset:0;z-index:50;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;
  background:repeating-linear-gradient(#0000 0 29px,#ffffff12 29px 30px),linear-gradient(160deg,var(--blue),var(--blue-d))}
#lock.on{display:flex}
#lock .nm{font-size:34px;font-weight:800;letter-spacing:-1px}
#lock .ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-size:22px;color:var(--gold);margin-bottom:22px}
#lock input{max-width:230px;text-align:center;font-size:26px;letter-spacing:10px;background:#fff;border:0}
#lock .btn{flex:none;width:230px;margin-top:6px}
#print{display:none}
@media print{
  header,.bar,.sheet,#toast,main,#lock{display:none!important}
  body{background:#fff} #print{display:block;font:11px Arial,sans-serif;color:#000}
  #print h2{margin:0 0 2px;font-size:18px} #print table{width:100%;border-collapse:collapse;margin-top:8px}
  #print th,#print td{border:1px solid #777;padding:4px 5px;text-align:right} #print th{background:#ddd}
  #print td.l,#print th.l{text-align:left} #print .sum td{font-weight:700;background:#eee}
}
</style>

<body>
<div id="lock"><div class="nm">Hisaab Kitaab</div><div class="ur" lang="ur" dir="rtl">حساب کتاب</div>
  <input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN" aria-label="PIN"><button class="btn gold" id="pinGo">Unlock</button></div>
<header id="hdr"><button class="ib" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title"></h1>
  <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></header>
<main id="main"></main>
<div class="bar" id="fab" hidden></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div id="toast" role="status"></div>
<div id="print"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script>
"use strict";
const KEY="daily_ledger_v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((Number(n)||0)*100+Number.EPSILON)/100;
const money=n=>r2(Math.abs(n)).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"-"+MON[+m-1]+"-"+y};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const side=b=>b>0?"CR":b<0?"DR":"NIL";   // b = credit - debit. CR = payable to party.

function seed(){
  return {parties:["PARTY 1","PARTY 2","PARTY 3","PARTY 4"].map((name,i)=>({id:"p"+(i+1),name})),pin:"",entries:[]};
}
let db; try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!Array.isArray(db.parties)||!Array.isArray(db.entries)) db=seed();
let storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false;toast("Could not save on this phone!")}}
save();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

let view={party:null,from:"",to:""};

/* ---------- calculations ---------- */
const totalOf=e=>r2((Number(e.weight)||0)*(Number(e.rate)||0));
const drOf=e=>r2((Number(e.rent)||0)+(Number(e.payment)||0));
function ledger(pid){              // sorted rows with running balance
  const rows=db.entries.filter(e=>e.partyId===pid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  let bal=0; return rows.map(e=>{const cr=totalOf(e),dr=drOf(e);bal=r2(bal+cr-dr);return {...e,cr,dr,bal}});
}
function sums(rows){const s={dr:0,cr:0,weight:0,rent:0,pay:0};rows.forEach(r=>{s.dr+=r.dr;s.cr+=r.cr;s.weight+=Number(r.weight)||0;s.rent+=Number(r.rent)||0;s.pay+=Number(r.payment)||0});
  for(const k in s)s[k]=k==="weight"?Math.round(s[k]*1000)/1000:r2(s[k]);s.bal=r2(s.cr-s.dr);return s}
window.__calc={ledger,sums,db:()=>db};

/* ---------- rendering ---------- */
const WORD={CR:"To pay",DR:"Advance",NIL:"Clear"};
const rs=n=>`<span class="rs">Rs</span>${money(n)}`;
const sdate=s=>{const[y,m,d]=s.split("-");return +d+" "+MON[+m-1]};
function render(){
  const m=$("#main"),fab=$("#fab"),hdr=$("#hdr");
  if(!view.party){
    hdr.classList.remove("sub");$("#back").hidden=true;fab.hidden=true;fab.innerHTML="";
    $("#title").innerHTML='Hisaab Kitaab<span lang="ur" dir="rtl">حساب کتاب</span>';
    let gt=0,n=0;
    const rows=db.parties.map((p,i)=>{const L=ledger(p.id),s=sums(L);gt=r2(gt+s.bal);n+=L.length;const sd=side(s.bal);
      return `<button data-open="${p.id}"><span class="av c${i%4}">${esc(p.name.trim().charAt(0)||"?")}</span>
        <span class="pn"><b>${esc(p.name)}</b><small>${L.length?L.length+(L.length===1?" entry":" entries")+", last "+sdate(L[L.length-1].date):"No entries yet"}</small></span>
        <span class="pb"><b class="${sd}">${rs(s.bal)}</b><span class="side ${sd}">${WORD[sd]}${sd==="NIL"?"":" ("+sd+")"}</span></span></button>`}).join("");
    const sd=side(gt);
    m.innerHTML=`<section class="hero"><div class="lbl">${sd==="CR"?"Total you have to pay":sd==="DR"?"Total advance with parties":"Nothing to pay right now"}</div>
        <div class="amt">${rs(gt)}</div><div class="meta"><span>${db.parties.length} parties</span><span>${n} ${n===1?"entry":"entries"}</span></div></section>
      <h2 class="sec">Parties</h2><div class="list">${rows}</div>
      <p class="hint">To pay (CR) means you owe the party. Advance (DR) means you have paid more than the purchases.</p>`;
    return;
  }
  const p=db.parties.find(x=>x.id===view.party); if(!p){view.party=null;return render()}
  hdr.classList.add("sub");$("#title").textContent=p.name;$("#back").hidden=false;
  const all=ledger(p.id);
  const rows=all.filter(r=>(!view.from||r.date>=view.from)&&(!view.to||r.date<=view.to));
  const s=sums(rows), closing=rows.length?rows[rows.length-1].bal:0, sd=side(closing);
  const list=rows.length?`<div class="list">`+rows.slice().reverse().map(r=>{const[y,mo,d]=r.date.split("-"),bs=side(r.bal);
    return `<button class="en" data-edit="${r.id}"><span class="dt"><b>${+d}</b><small>${MON[+mo-1]} ${y.slice(2)}</small></span><span class="eb">
      ${r.cr?`<span class="ln"><span class="t">Purchase${r.vehicle?`<span class="veh">${esc(r.vehicle)}</span>`:""}<small>${Number(r.weight)} &times; ${money(r.rate)}</small></span><span class="a CR">+ ${money(r.cr)}</span></span>`:""}
      ${r.rent?`<span class="ln"><span class="t">Rent${!r.cr&&r.vehicle?`<span class="veh">${esc(r.vehicle)}</span>`:""}<small>freight + loading</small></span><span class="a DR">&minus; ${money(r.rent)}</span></span>`:""}
      ${r.payment?`<span class="ln"><span class="t">Payment made</span><span class="a DR">&minus; ${money(r.payment)}</span></span>`:""}
      ${r.note?`<span class="note" style="display:block">${esc(r.note)}</span>`:""}
      <span class="run"><span>Balance after this</span><b class="${bs}">${money(r.bal)} ${bs}</b></span></span></button>`}).join("")+`</div>`
    :`<div class="empty"><b>${view.from||view.to?"No entries in these dates":"No entries yet"}</b>${view.from||view.to?"Change the dates or clear them.":"Add the first purchase or payment with the buttons below."}</div>`;
  m.innerHTML=`<section class="hero"><div class="lbl">${sd==="CR"?"You have to pay":sd==="DR"?"Advance with this party":"Balance is clear"}</div>
      <div class="amt">${rs(closing)}</div><div class="meta">${sd==="NIL"?"":`<span>${sd}</span>`}<span>${rows.length?sdate(rows[0].date)+" to "+sdate(rows[rows.length-1].date)+" "+rows[rows.length-1].date.slice(0,4):"No entries"}</span>${s.weight?`<span>Weight ${s.weight.toLocaleString("en-US",{maximumFractionDigits:3})}</span>`:""}</div></section>
    <div class="tiles"><div class="tile"><small>Debit (DR)</small><b>${money(s.dr)}</b></div><div class="tile"><small>Credit (CR)</small><b>${money(s.cr)}</b></div></div>
    <div class="filter"><div><label for="fFrom">From</label><input type="date" id="fFrom" value="${view.from}"></div><div><label for="fTo">To</label><input type="date" id="fTo" value="${view.to}"></div>
      ${view.from||view.to?'<button class="chip" id="fClear">Clear</button>':"<span></span>"}</div>
    <h2 class="sec">Entries</h2>${list}`;
  fab.hidden=false;fab.innerHTML=`<div><button class="btn gold" data-new="pur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Purchase</button><button class="btn blue" data-new="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Payment</button></div>`;
}

/* ---------- entry form ---------- */
let form=null;
function openForm(kind,id){
  const e=id?db.entries.find(x=>x.id===id):null;
  if(e) kind=(totalOf(e)||e.vehicle||e.rent)?"pur":"pay";
  form={kind,id:id||null};
  const v=e||{date:today(),vehicle:"",weight:"",rate:"",rent:"",payment:"",note:""};
  const n=x=>x?x:"";
  $("#sheetBody").innerHTML=`<h2>${e?"Edit entry":"New entry"}</h2>
    <div class="seg"><button data-kind="pur" class="${kind==="pur"?"on":""}">Purchase</button><button data-kind="pay" class="${kind==="pay"?"on":""}">Payment</button></div>
    <label>Date</label><input type="date" id="eDate" value="${v.date}">
    <div id="purBox" ${kind==="pur"?"":"hidden"}>
      <label>Vehicle No</label><input id="eVeh" value="${esc(v.vehicle)}" autocapitalize="characters" autocomplete="off" placeholder="Truck number">
      <div class="two"><div><label>Weight</label><input id="eW" type="number" inputmode="decimal" step="any" min="0" value="${n(v.weight)}" placeholder="0.000"></div>
      <div><label>Rate (per unit)</label><input id="eR" type="number" inputmode="decimal" step="any" min="0" value="${n(v.rate)}" placeholder="0"></div></div>
      <div class="total"><span>Total = weight &times; rate</span><span id="eTot">0.00</span></div>
      <label>Rent (freight + loading paid)</label><input id="eRent" type="number" inputmode="decimal" step="any" min="0" value="${n(v.rent)}" placeholder="0">
    </div>
    <div id="payBox" ${kind==="pay"?"":"hidden"}>
      <label>Payment made (Rs)</label><input id="ePay" type="number" inputmode="decimal" step="any" min="0" value="${n(v.payment)}" placeholder="0">
    </div>
    <label>Note (optional)</label><input id="eNote" value="${esc(v.note)}" autocomplete="off">
    <div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn blue" id="eSave">Save entry</button></div>
    ${e?'<div class="row" style="margin-top:10px"><button class="btn del" id="eDel">Delete this entry</button></div>':""}`;
  $("#sheet").classList.add("on"); calcTot();
}
function calcTot(){const t=$("#eTot");if(t)t.textContent=money(r2((+$("#eW").value||0)*(+$("#eR").value||0)))}
function saveForm(){
  const num=id=>{const x=parseFloat($(id).value);return isFinite(x)&&x>0?x:0};
  const pur=form.kind==="pur";
  const e={date:$("#eDate").value||today(),vehicle:pur?$("#eVeh").value.trim().toUpperCase():"",weight:pur?num("#eW"):0,rate:pur?num("#eR"):0,
    rent:pur?num("#eRent"):0,payment:pur?0:num("#ePay"),note:$("#eNote").value.trim()};
  if(pur&&!(e.weight&&e.rate)&&!e.rent) return toast("Enter weight and rate");
  if(!pur&&!e.payment) return toast("Enter the payment amount");
  if(form.id){Object.assign(db.entries.find(x=>x.id===form.id),e)} else db.entries.push({id:uid(),partyId:view.party,ts:Date.now(),...e});
  save();closeSheet();render();if(storageOK)toast("Entry saved");
}

/* ---------- real Excel (.xlsx) and PDF files, built inside the app (works offline) ---------- */
const XP=(()=>{
  const enc=new TextEncoder();
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  function zip(files){                       // files: [[name, string]] -> Blob (stored, no compression)
    const parts=[],central=[];let off=0;
    const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
    for(const[name,text]of files){
      const nb=enc.encode(name),data=enc.encode(text),c=crc32(data);
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
      h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
      parts.push(h,nb,data);
      const ce=new DataView(new ArrayBuffer(46));
      ce.setUint32(0,0x02014b50,true);ce.setUint16(4,20,true);ce.setUint16(6,20,true);ce.setUint16(8,0x0800,true);ce.setUint16(10,0,true);ce.setUint16(12,dt,true);ce.setUint16(14,dd,true);
      ce.setUint32(16,c,true);ce.setUint32(20,data.length,true);ce.setUint32(24,data.length,true);ce.setUint16(28,nb.length,true);ce.setUint32(42,off,true);
      central.push(ce,nb);off+=30+nb.length+data.length;
    }
    const csize=central.reduce((s,x)=>s+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
    return new Blob([...parts,...central,e],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }
  const x=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const colL=i=>{let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s};
  /* style ids: 1 header, 2 text, 3 money, 4 weight, 5 total money, 6 title, 7 total text, 8 total weight, 9 sub, 10 CR text, 11 DR text */
  const STYLES=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.000"/><numFmt numFmtId="165" formatCode="#,##0.00"/></numFmts>
<fonts count="6"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="15"/><color rgb="FF131A33"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font><font><sz val="10"/><color rgb="FF5A6380"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFD92D20"/><name val="Arial"/></font></fonts>
<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2340C8"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE9EEFF"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFB8C0D9"/></left><right style="thin"><color rgb="FFB8C0D9"/></right><top style="thin"><color rgb="FFB8C0D9"/></top><bottom style="thin"><color rgb="FFB8C0D9"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="12"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>
<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>
<xf numFmtId="165" fontId="3" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="3" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>
<xf numFmtId="164" fontId="3" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>
<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="5" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>
<xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  function sheetXML(rows,widths,freeze){       // rows: [[ [value, style] ... ]], value number|string|null
    let body="";
    rows.forEach((r,ri)=>{let cells="";r.forEach((c,ci)=>{if(!c)return;const[v,s]=c,ref=colL(ci)+(ri+1);
      if(v===null||v===undefined||v==="")cells+=`<c r="${ref}" s="${s||0}"/>`;
      else if(typeof v==="number")cells+=`<c r="${ref}" s="${s||0}"><v>${v}</v></c>`;
      else cells+=`<c r="${ref}" s="${s||0}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`});
      body+=`<row r="${ri+1}"${ri===freeze-1?' ht="30" customHeight="1"':''}>${cells}</row>`});
    const cols=widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
    const pane=freeze?`<pane ySplit="${freeze}" topLeftCell="A${freeze+1}" activePane="bottomLeft" state="frozen"/>`:"";

/* rows for one party, honouring the date filter; adds an opening balance line when entries before the start date exist */
function statement(pid,from,to){
  const all=ledger(pid);let opening=0,hasOpen=false;
  if(from){const before=all.filter(r=>r.date<from);if(before.length){opening=before[before.length-1].bal;hasOpen=true}}
  const rows=all.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));
  const s=sums(rows),closing=rows.length?rows[rows.length-1].bal:opening;
  const start=from||(rows[0]&&rows[0].date)||"",end=to||(rows.length&&rows[rows.length-1].date)||"";
  return {p:db.parties.find(x=>x.id===pid),rows,s,opening,hasOpen,closing,start,end};
}

/* give the file to the client: share sheet (WhatsApp, Gmail...) when the phone supports it, otherwise save to Downloads */
function deliver(blob,name,what){
  let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  const canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  if(!canShare){saveBlob(blob,name);closeSheet();return toast(what+" saved in Downloads")}
  $("#sheetBody").innerHTML=`<h2>${what} is ready</h2><p class="hint" style="margin:0 4px 14px">${esc(name)}</p>
    <div class="row" style="flex-direction:column;gap:10px;margin-top:6px"><button class="btn blue" id="shareIt">Send (WhatsApp, Gmail…)</button><button class="btn gold" id="saveIt">Save to phone</button><button class="btn ghost" data-close>Close</button></div>`;
  $("#sheet").classList.add("on");
  $("#shareIt").onclick=()=>{navigator.share({files:[file],title:name}).then(()=>closeSheet()).catch(()=>{})};
  $("#saveIt").onclick=()=>{saveBlob(blob,name);closeSheet();toast(what+" saved in Downloads")};
}
function saveBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function exportFile(kind,scope){

    const tag=scope==="one"?safeName(list[0].p.name):"All_Parties";
    if(kind==="xlsx"){const sheets=(scope==="one"?[]:[summarySheet(list)]).concat(list.map(partySheet));
      return deliver(XP.xlsx(sheets),tag+"_"+today()+".xlsx","Excel file")}

}

    const p=a==="rename"?db.parties.find(x=>x.id===view.party):null;
    $("#sheetBody").innerHTML=`<h2>${p?"Rename party":"New party"}</h2><label>Party name</label><input id="pName" value="${p?esc(p.name):""}" autocapitalize="characters">
      <div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn blue" id="pSave">Save name</button></div>`;
    $("#pSave").onclick=()=>{const n=$("#pName").value.trim().toUpperCase();if(!n)return toast("Enter a name");if(p)p.name=n;else db.parties.push({id:"p"+uid(),name:n});save();closeSheet();render()};return;
  }
  if(a==="pin"){
    $("#sheetBody").innerHTML=`<h2>PIN lock</h2><label>New PIN (leave empty to remove the lock)</label><input id="pinNew" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn blue" id="pinSave">Save PIN</button></div>`;
    $("#pinSave").onclick=()=>{db.pin=$("#pinNew").value.trim();save();closeSheet();toast(db.pin?"PIN set":"PIN removed")};
  }
}
$("#restoreFile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.parties)||!Array.isArray(d.entries))throw 0;
    if(confirm("Replace everything in the app with this backup ("+d.entries.length+" entries)?")){db=d;save();view={party:null,from:"",to:""};render();toast("Backup restored")}}
    catch(e){toast("This is not a valid backup file")}ev.target.value=""};rd.readAsText(f)};

/* ---------- wiring ---------- */
function closeSheet(){$("#sheet").classList.remove("on")}
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t){if(ev.target.id==="sheet")closeSheet();return}
  const d=t.dataset;
  if(d.open){view={party:d.open,from:"",to:""};render();scrollTo(0,0)}
  else if(d.new)openForm(d.new)
  else if(d.edit)openForm(null,d.edit)
  else if(d.kind){form.kind=d.kind;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b===t));$("#purBox").hidden=d.kind!=="pur";$("#payBox").hidden=d.kind!=="pay"}
  else if("close" in d)closeSheet()
  else if(d.act)act(d.act)
  else if(t.id==="eSave")saveForm()
  else if(t.id==="eDel"){if(confirm("Delete this entry?")){db.entries=db.entries.filter(x=>x.id!==form.id);save();closeSheet();render();toast("Entry deleted")}}
  else if(t.id==="back"){view.party=null;render()}
  else if(t.id==="menuBtn")openMenu()
  else if(t.id==="fClear"){view.from=view.to="";render()}
});
document.addEventListener("input",ev=>{if(ev.target.id==="eW"||ev.target.id==="eR")calcTot()});
document.addEventListener("change",ev=>{if(ev.target.id==="fFrom"){view.from=ev.target.value;render()}if(ev.target.id==="fTo"){view.to=ev.target.value;render()}});
function unlock(){if($("#pinIn").value===db.pin){$("#lock").classList.remove("on")}else{$("#pinIn").value="";toast("Wrong PIN")}}
$("#pinGo").onclick=unlock;$("#pinIn").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
if(db.pin)$("#lock").classList.add("on");
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
